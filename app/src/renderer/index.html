<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data: ws://localhost:*" />
    <title>SMW Program Map</title>
  </head>
  <body>
    <header>
      <span id="title"></span>
      <span id="progress" hidden></span>
      <input id="search" type="search" placeholder="Search symbols, types, signals" />
      <label id="autoreload-label"><input id="autoreload" type="checkbox" disabled /> Auto-reload</label>
      <button id="save">Save view</button>
      <button id="copy">Copy view</button>
      <button id="overview">Export overview</button>
    </header>
    <main>
      <div id="map"></div>
      <div id="empty">Drop an SMW, UMC or CMC file here</div>
      <aside>
        <div id="results"></div>
        <div id="occurrences" hidden></div>
      </aside>
      <div id="message" hidden></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
